<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Rose · Midnight Botanica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #01040a;
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .title {
      position: fixed;
      top: 4.2vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      animation: titleIn 3.2s cubic-bezier(.2, .7, .2, 1) .6s forwards;
    }

    .title .eyebrow {
      display: block;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(170, 200, 255, .42);
      margin-bottom: 10px;
    }

    .title h1 {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 5.4vw, 78px);
      font-weight: 300;
      letter-spacing: 3px;
      line-height: 1;
      color: rgba(236, 243, 255, .92);
      text-shadow: 0 0 30px rgba(80, 130, 255, .25);
    }

    .title h1 em {
      font-style: italic;
      font-weight: 300;
      background: linear-gradient(180deg, #cfe2ff 0%, #79a8ff 55%, #3f6fe0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .title .line {
      width: 46px;
      height: 1px;
      margin: 14px auto 12px;
      background: linear-gradient(90deg, transparent, rgba(140, 180, 255, .6), transparent);
    }

    .title .sub {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 15px;
      letter-spacing: 2px;
      color: rgba(200, 218, 255, .38);
    }

    @keyframes titleIn {
      from {
        opacity: 0;
        transform: translate(-50%, -10px);
        filter: blur(6px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
        filter: blur(0);
      }
    }

    .controls {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      display: flex;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      border: 1px solid rgba(130, 170, 255, .14);
      background: rgba(6, 14, 30, .78);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .04);
      opacity: 0;
      animation: fadeIn 2s ease 2.4s forwards;
    }

    .controls button {
      border: none;
      border-radius: 999px;
      background: transparent;
      color: rgba(225, 236, 255, .78);
      padding: 10px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 1.5px;
      transition: background .35s ease, color .35s ease;
    }

    .controls button:hover,
    .controls button.active {
      background: rgba(60, 110, 220, .28);
      color: #fff;
    }

    .footer-mark {
      position: fixed;
      left: 22px;
      bottom: 24px;
      z-index: 5;
      color: rgba(150, 180, 230, .22);
      font-size: 9px;
      letter-spacing: 5px;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 2s ease 2.8s forwards;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.035;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 700px), (orientation: portrait) {
      .title {
        top: 2.5vh;
      }

      .title .eyebrow {
        font-size: 8px;
        letter-spacing: 5px;
        margin-bottom: 5px;
      }

      .title h1 {
        font-size: clamp(28px, 7.5vw, 44px);
        letter-spacing: 2px;
      }

      .title .line {
        width: 36px;
        margin: 8px auto 7px;
      }

      .title .sub {
        font-size: 11px;
        letter-spacing: 1px;
      }

      .controls {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        bottom: 12px;
        padding: 4px;
        gap: 3px;
      }

      .controls button {
        padding: 8px 14px;
        font-size: 10px;
        letter-spacing: 1px;
      }

      .footer-mark {
        display: none;
      }
    }
  </style>
</head>

<body>

  <canvas id="scene"></canvas>
  <div class="grain" id="grainLayer"></div>

  <div class="title">
    <span class="eyebrow">Midnight Botanica</span>
    <h1>Blue <em>Roses</em></h1>
    <div class="line"></div>
    <div class="sub">a quiet bloom beneath the moonlight</div>
  </div>

  <div class="controls">
    <button id="replayBtn">↻ Ulangi</button>
    <button id="loopBtn">∞ Siklus</button>
  </div>

  <div class="footer-mark">BLUE ROSE · 3D CANVAS STUDY</div>

  <script>
    (() => {
      "use strict";

      /* =========================================================
         SETUP & UTILITIES
      ========================================================= */
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const replayBtn = document.getElementById("replayBtn");
      const loopBtn = document.getElementById("loopBtn");

      const PI = Math.PI, TAU = PI * 2;
      const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
      const easeInOutSine = t => -(Math.cos(PI * clamp(t)) - 1) / 2;
      const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
      const easeOutBack = t => { t = clamp(t); const c1 = 1.05, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
      const norm3 = (x, y, z) => { const l = Math.hypot(x, y, z) || 1; return [x / l, y / l, z / l]; };

      function makeRng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = makeRng(1117);

      const mk = (w = 1, h = 1) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

      const midCv = mk(), mctx = midCv.getContext("2d");
      const glowCv = mk(), gctx = glowCv.getContext("2d");
      const velvetCv = mk(), velvetCtx = velvetCv.getContext("2d");
      const bgCv = mk(), bgx = bgCv.getContext("2d");
      const raysCv = mk(), rayx = raysCv.getContext("2d");
      const vigCv = mk(), vgx = vigCv.getContext("2d");

      // GPU-composited static film grain (avoids per-frame canvas overlay readback)
      (() => {
        const grainCv = mk(180, 180);
        const g = grainCv.getContext("2d");
        const id = g.createImageData(180, 180);
        for (let i = 0; i < id.data.length; i += 4) {
          const v = 128 + (Math.random() - 0.5) * 120;
          id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
          id.data[i + 3] = 255;
        }
        g.putImageData(id, 0, 0);
        const gl = document.getElementById("grainLayer");
        if (gl && typeof grainCv.toDataURL === "function") {
          gl.style.backgroundImage = `url(${grainCv.toDataURL()})`;
        }
      })();

      // sprites
      function makeBokeh(r, g, b) {
        const c = mk(128, 128), x = c.getContext("2d");
        const gr = x.createRadialGradient(64, 64, 0, 64, 64, 63);
        gr.addColorStop(0, `rgba(${r},${g},${b},0.30)`);
        gr.addColorStop(0.70, `rgba(${r},${g},${b},0.38)`);
        gr.addColorStop(0.86, `rgba(${r},${g},${b},0.62)`);
        gr.addColorStop(0.93, `rgba(${r},${g},${b},0.22)`);
        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
        x.fillStyle = gr; x.beginPath(); x.arc(64, 64, 63, 0, TAU); x.fill();
        return c;
      }
      function makeSoft(r, g, b) {
        const c = mk(64, 64), x = c.getContext("2d");
        const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
        gr.addColorStop(0.18, `rgba(${r},${g},${b},0.65)`);
        gr.addColorStop(0.5, `rgba(${r},${g},${b},0.12)`);
        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
        x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
        return c;
      }
      const BOKEH = [makeBokeh(80, 140, 255), makeBokeh(90, 205, 255), makeBokeh(150, 140, 255), makeBokeh(255, 214, 160)];
      const SOFT = makeSoft(200, 225, 255);
      const SOFT_GOLD = makeSoft(255, 230, 175);
      const AURA_SPR = (() => {
        const c = mk(128, 128), x = c.getContext("2d");
        const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, "rgba(80,130,255,1)");
        g.addColorStop(0.4, "rgba(40,80,210,0.45)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        x.fillStyle = g; x.fillRect(0, 0, 128, 128);
        return c;
      })();
      const DEW_SPR = (() => {
        const c = mk(64, 64), x = c.getContext("2d");
        const r = 16, cx = 26, cy = 24;
        let g = x.createRadialGradient(cx + r * 0.35, cy + r * 0.5, 0, cx + r * 0.35, cy + r * 0.5, r * 1.45);
        g.addColorStop(0, "rgba(0,4,25,0.55)"); g.addColorStop(1, "rgba(0,4,25,0)");
        x.fillStyle = g; x.beginPath(); x.arc(cx + r * 0.35, cy + r * 0.5, r * 1.45, 0, TAU); x.fill();
        g = x.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.1, cx, cy, r);
        g.addColorStop(0, "rgba(215,235,255,0.22)");
        g.addColorStop(0.55, "rgba(120,170,255,0.16)");
        g.addColorStop(0.86, "rgba(25,60,160,0.48)");
        g.addColorStop(1, "rgba(200,228,255,0.65)");
        x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
        return c;
      })();
      function makeMist(r, g, b) {
        const c = mk(256, 128), x = c.getContext("2d");
        const blobs = [[128, 66, 98, 0.24], [82, 72, 68, 0.18], [174, 70, 72, 0.18], [128, 54, 58, 0.14]];
        for (const [bx, by, br, ba] of blobs) {
          const gr = x.createRadialGradient(bx, by, 0, bx, by, br);
          gr.addColorStop(0, `rgba(${r},${g},${b},${ba})`);
          gr.addColorStop(0.5, `rgba(${r},${g},${b},${ba * 0.4})`);
          gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
          x.fillStyle = gr;
          x.beginPath(); x.ellipse(bx, by, br, br * 0.56, 0, 0, TAU); x.fill();
        }
        return c;
      }
      const MIST_TEX = [makeMist(34, 88, 138), makeMist(22, 68, 92)];

      let W = 0, H = 0, DPR = 1, S = 0, SX = 0, CX = 0, isMobile = false;

      /* =========================================================
         STATIC LAYERS
      ========================================================= */
      function buildBackground() {
        bgCv.width = Math.round(W * DPR); bgCv.height = Math.round(H * DPR);
        bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
        const R = Math.max(W, H);

        let g = bgx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, R * 0.95);
        g.addColorStop(0, "#0c1f3d");
        g.addColorStop(0.32, "#06132a");
        g.addColorStop(0.68, "#020915");
        g.addColorStop(1, "#000308");
        bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);

        g = bgx.createRadialGradient(W * 0.18, H * 0.04, 0, W * 0.18, H * 0.04, R * 0.8);
        g.addColorStop(0, "rgba(130,170,255,0.22)");
        g.addColorStop(0.35, "rgba(60,100,210,0.08)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);

        // out-of-focus garden (drawn tiny then upscaled = natural lens blur)
        const sw = Math.max(2, Math.round(W / 16)), sh = Math.max(2, Math.round(H / 16));
        const sc = mk(sw, sh), sx = sc.getContext("2d");
        sx.scale(sw / W, sh / H);
        const r2 = makeRng(42);
        const m = Math.min(W, H);

        for (let i = 0; i < 46; i++) {
          const x = r2() * W, y = H * (0.6 + r2() * 0.5), rr = m * (0.08 + r2() * 0.2);
          const gg = sx.createRadialGradient(x, y, 0, x, y, rr);
          gg.addColorStop(0, `rgba(${(6 + r2() * 10) | 0},${(30 + r2() * 30) | 0},${(38 + r2() * 30) | 0},${0.3 + r2() * 0.35})`);
          gg.addColorStop(1, "rgba(0,0,0,0)");
          sx.fillStyle = gg; sx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
        }

        const far = [[0.12, 0.64, 0.07], [0.87, 0.70, 0.085], [0.76, 0.50, 0.035], [0.23, 0.46, 0.03], [0.95, 0.38, 0.045], [0.04, 0.86, 0.06], [0.62, 0.84, 0.05]];
        for (const [fx, fy, fr] of far) {
          const x = fx * W, y = fy * H, rr = fr * m;
          sx.strokeStyle = "rgba(10,42,32,0.65)";
          sx.lineWidth = rr * 0.22;
          sx.beginPath(); sx.moveTo(x, y);
          sx.quadraticCurveTo(x + rr * 0.6, y + rr * 3, x - rr * 0.3, H + rr * 2);
          sx.stroke();
          const gg = sx.createRadialGradient(x, y, 0, x, y, rr * 1.6);
          gg.addColorStop(0, "rgba(70,120,240,0.55)");
          gg.addColorStop(0.5, "rgba(25,55,160,0.35)");
          gg.addColorStop(1, "rgba(0,0,0,0)");
          sx.fillStyle = gg; sx.fillRect(x - rr * 2, y - rr * 2, rr * 4, rr * 4);
        }

        const midW = Math.max(2, Math.round(W / 4)), midH = Math.max(2, Math.round(H / 4));
        const mc = mk(midW, midH), mx = mc.getContext("2d");
        mx.imageSmoothingQuality = "high";
        mx.drawImage(sc, 0, 0, midW, midH);
        bgx.imageSmoothingEnabled = true;
        bgx.imageSmoothingQuality = "high";
        bgx.drawImage(mc, 0, 0, W, H);

        // fine stars
        for (let i = 0; i < 120; i++) {
          const x = r2() * W, y = r2() * H * 0.62, r = 0.3 + r2() * 0.9, a = 0.04 + r2() * 0.28;
          bgx.fillStyle = `rgba(190,215,255,${a})`;
          bgx.beginPath(); bgx.arc(x, y, r, 0, TAU); bgx.fill();
        }
      }

      function buildRays() {
        const sw = Math.max(2, Math.round(W / 10)), sh = Math.max(2, Math.round(H / 10));
        raysCv.width = sw; raysCv.height = sh;
        rayx.setTransform(sw / W, 0, 0, sh / H, 0, 0);
        rayx.clearRect(0, 0, W, H);
        const ox = W * 0.1, oy = -H * 0.2;
        const len = Math.hypot(W, H) * 1.25;
        const rays = [[0.78, 0.05, 0.08], [0.92, 0.03, 0.06], [1.02, 0.06, 0.09], [1.14, 0.025, 0.05], [0.68, 0.03, 0.05]];
        for (const [ang, spread, a] of rays) {
          rayx.beginPath(); rayx.moveTo(ox, oy);
          rayx.lineTo(ox + Math.cos(ang - spread) * len, oy + Math.sin(ang - spread) * len);
          rayx.lineTo(ox + Math.cos(ang + spread) * len, oy + Math.sin(ang + spread) * len);
          rayx.closePath();
          const g = rayx.createLinearGradient(ox, oy, ox + Math.cos(ang) * len * 0.85, oy + Math.sin(ang) * len * 0.85);
          g.addColorStop(0, `rgba(160,195,255,${a * 1.8})`);
          g.addColorStop(0.45, `rgba(100,145,240,${a})`);
          g.addColorStop(1, "rgba(40,80,200,0)");
          rayx.fillStyle = g; rayx.fill();
        }
      }

      function buildVignette() {
        const sw = Math.max(2, Math.round(W / 3)), sh = Math.max(2, Math.round(H / 3));
        vigCv.width = sw; vigCv.height = sh;
        vgx.setTransform(sw / W, 0, 0, sh / H, 0, 0);
        const g = vgx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.2, W / 2, H * 0.5, Math.max(W, H) * 0.78);
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(0.6, "rgba(0,2,8,0.35)");
        g.addColorStop(1, "rgba(0,1,4,0.88)");
        vgx.fillStyle = g; vgx.fillRect(0, 0, W, H);
        const b = vgx.createLinearGradient(0, H * 0.75, 0, H);
        b.addColorStop(0, "rgba(0,0,0,0)");
        b.addColorStop(1, "rgba(0,2,6,0.55)");
        vgx.fillStyle = b; vgx.fillRect(0, 0, W, H);
      }

      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        isMobile = W < 768 || W < H;
        DPR = isMobile ? Math.min(window.devicePixelRatio || 1, 1.0) : Math.min(window.devicePixelRatio || 1, 1.25);
        const pw = Math.round(W * DPR), ph = Math.round(H * DPR);
        canvas.width = pw; canvas.height = ph;
        canvas.style.width = W + "px"; canvas.style.height = H + "px";
        midCv.width = Math.max(2, Math.round(W / (isMobile ? 3.5 : 3)));
        midCv.height = Math.max(2, Math.round(H / (isMobile ? 3.5 : 3)));
        glowCv.width = Math.max(2, Math.round(W / (isMobile ? 10 : 9)));
        glowCv.height = Math.max(2, Math.round(H / (isMobile ? 10 : 9)));
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        if (isMobile) {
          S = Math.min(W * 0.44, H * 0.29);
          SX = Math.min(S * 0.65, W * 0.22);
        } else {
          S = Math.min(W * 0.44, H * 0.42);
          SX = Math.min(S * 0.96, W * 0.30);
        }
        CX = W * 0.5;
        let maxPad = 64;
        for (const rose of ROSES) {
          const pad = Math.max(4, Math.ceil(S * rose.scale * 0.90));
          const rpw = pad * 2;
          rose.pad = pad;
          rose.rpw = rpw;
          rose.cv.width = rpw;
          rose.cv.height = rpw;
          rose.ctx.setTransform(1, 0, 0, 1, 0, 0);
          rose.ctx.imageSmoothingEnabled = true;
          rose.hasCache = false;
          if (pad > maxPad) maxPad = pad;
        }
        const vpw = Math.max(8, maxPad * 2);
        velvetCv.width = vpw;
        velvetCv.height = vpw;
        velvetCtx.imageSmoothingEnabled = true;
        buildBackground(); buildRays(); buildVignette();
      }

      /* =========================================================
         3D ROSE MODEL (5-ROSE BOUQUET CHOREOGRAPHY)
      ========================================================= */
      const GOLD = PI * (3 - Math.sqrt(5));
      const DEW_SPEC_HERO = [[1, 0.54, 0.18, 0.021], [2, 0.62, -0.28, 0.017], [4, 0.48, 0.12, 0.014], [6, 0.58, 0.30, 0.018], [7, 0.46, -0.14, 0.013], [9, 0.56, 0.04, 0.015], [3, 0.66, -0.06, 0.012], [12, 0.52, 0.24, 0.012]];
      const DEW_SPEC_SIDE = [[1, 0.55, 0.16, 0.022], [3, 0.60, -0.24, 0.018], [5, 0.48, 0.12, 0.015], [8, 0.54, -0.08, 0.014]];

      function createRoseModel(seedVal, isHero) {
        const rr = makeRng(seedVal);
        const np = isHero ? 22 : 18;
        const arr = [];
        for (let i = 0; i < 5; i++) {
          arr.push({
            kind: 1, t: 1, isHero,
            theta: i * TAU / 5 + 0.35 + (rr() - 0.5) * 0.2,
            len: 0.42 * (0.9 + rr() * 0.2),
            wr: 0.17,
            r0: 0.105, z0: -0.078,
            seed: rr() * 100, hue: 0, j1: 0, j2: 0,
            U: isHero ? 7 : 5,
            V: isHero ? 4 : 3
          });
        }
        for (let k = 0; k < np; k++) {
          const t = k / (np - 1);
          arr.push({
            kind: 0, t, isHero,
            theta: k * GOLD + (rr() - 0.5) * 0.20,
            len: lerp(0.24, 0.65, Math.pow(t, 0.78)) * (0.94 + rr() * 0.12),
            wr: lerp(0.28, 0.53, t) * (0.92 + rr() * 0.16),
            r0: lerp(0.008, 0.105, Math.pow(t, 0.92)),
            z0: lerp(0.065, -0.035, t),
            seed: rr() * 100,
            hue: (rr() - 0.5) * 0.45,
            j1: rr() - 0.5, j2: rr() - 0.5,
            start: 0.06 + (1 - t) * 0.58,

      function buildSpine(par, L, r0, z0) {

      function transform(X, Y, Z, out, o) {

        out[o + 5] = -y2 * cam.cb + z2 * cam.sb;

      function petalPoint(pt, par, L, hwBase, u, v, time, out, o) {

      function pushQuad(ax, ay, bx, by, cx, cy, dx, dy, depth, col, cKey) {

        // dew drops
        if (pt.dew && dewA > 0.001) {

      function drawDew(c, x, y, r, a, time = 0) {
